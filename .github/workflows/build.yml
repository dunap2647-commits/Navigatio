name: Build

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  theos:
    name: Build .deb (Theos, iOS 12 arm64)
    runs-on: ubuntu-latest

    env:
      THEOS: /opt/theos
      TARGET: iphone:clang:latest:12.0
      ARCHS: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git make curl xz-utils libplist-utils unzip \
            clang fakeroot dpkg-dev perl >/dev/null

      - name: Install ldid
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus7

      - name: Verify ldid
        run: |
          which ldid
          ldid -v || true

      - name: Bootstrap Theos
        run: |
          if [ ! -d "$THEOS/makefiles" ]; then
            sudo git clone --recursive --depth 1 \
              https://github.com/theos/theos.git "$THEOS"
            sudo chown -R "$USER:$USER" "$THEOS"
          fi

          mkdir -p "$THEOS/sdks"
          if [ -z "$(ls -A "$THEOS/sdks" 2>/dev/null)" ]; then
            curl -fL -o /tmp/sdks.tar.gz \
              https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
            tar -xzf /tmp/sdks.tar.gz -C /tmp
            cp -r /tmp/sdks-master/*.sdk "$THEOS/sdks/" 2>/dev/null || true
          fi

          sudo curl -fL -o /usr/local/bin/dm.pl \
            https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl
          sudo chmod +x /usr/local/bin/dm.pl

          chmod +x "$THEOS/bin/"* 2>/dev/null || true

      - name: Verify toolchain
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/sdks/" || true
          which clang ldid dpkg-deb || true

      - name: Lint plists
        run: |
          for p in daemon/entitlements.plist app/entitlements.plist app/Info.plist \
                   layout/Library/LaunchDaemons/com.navigatio.daemon.plist; do
            if [ ! -f "$p" ]; then
              echo "::warning::Файл $p не найден — пропускаем"
              continue
            fi
            echo "-> $p"
            python3 -c "import plistlib, sys; plistlib.load(open(sys.argv[1], 'rb')); print('ok')" "$p"
          done

      - name: Build
        run: |
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: navigatio-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .theos/_/DEBIAN
            **/*.log
          if-no-files-found: ignore
