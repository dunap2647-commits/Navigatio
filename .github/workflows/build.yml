name: Build

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  theos:
    name: Build .deb (Theos, iOS 12 arm64)
    runs-on: ubuntu-latest

    env:
      TARGET: iphone:clang:latest:12.0
      ARCHS: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git make curl xz-utils libplist-utils unzip \
            clang fakeroot dpkg-dev perl >/dev/null

      - name: Install ldid
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus7

      # Этот шаг заменяет ручную настройку Theos и SDK
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '/opt/theos'  # Указываем ту же директорию для совместимости
          theos-sdks: 'https://github.com/theos/sdks' # Репозиторий с SDK

      - name: Verify toolchain
        run: |
          echo "THEOS=/opt/theos"
          echo "--- SDKs ---"
          ls /opt/theos/sdks/ || true
          echo "--- Tools ---"
          which clang ldid dpkg-deb || true

      - name: Lint plists
        run: |
          for p in daemon/entitlements.plist app/entitlements.plist app/Info.plist \
                   layout/Library/LaunchDaemons/com.navigatio.daemon.plist; do
            if [ ! -f "$p" ]; then
              echo "::warning::File $p not found - skipping"
              continue
            fi
            echo "-> $p"
            python3 -c "import plistlib, sys; plistlib.load(open(sys.argv[1], 'rb')); print('ok')" "$p"
          done

      - name: Build
        run: |
          # Устанавливаем THEOS для шага сборки
          export THEOS=/opt/theos
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: navigatio-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .theos/_/DEBIAN
            **/*.log
          if-no-files-found: ignore
