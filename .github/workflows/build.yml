name: Build

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  theos:
    name: Build .deb (Theos, iOS 12 arm64)
    runs-on: ubuntu-latest

    env:
      THEOS: /opt/theos
      TARGET: iphone:clang:latest:12.0
      ARCHS: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git make curl xz-utils libplist-utils unzip \
            clang fakeroot dpkg-dev perl >/dev/null

      - name: Install ldid
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus7

      - name: Verify ldid
        run: |
          which ldid
          ldid -v || true

      - name: Bootstrap Theos
        run: |
          # 1. Клонируем Theos, если его еще нет
          if [ ! -d "$THEOS/makefiles" ]; then
            sudo git clone --recursive --depth 1 \
              https://github.com/theos/theos.git "$THEOS"
            sudo chown -R "$USER:$USER" "$THEOS"
          fi

          # 2. Загружаем SDK напрямую из официального репозитория
          mkdir -p "$THEOS/sdks"
          if [ -z "$(ls -A "$THEOS/sdks" 2>/dev/null)" ]; then
            echo "Downloading SDKs..."
            # Клонируем репозиторий с SDK во временную папку
            git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
            
            # Копируем нужный SDK (например, iPhoneOS12.4.sdk) в Theos
            # Вы можете заменить версию на ту, что необходима для вашего проекта
            cp -r /tmp/theos-sdks/iPhoneOS12.4.sdk "$THEOS/sdks/"
            
            # Проверяем, что SDK скопировался
            if [ ! -d "$THEOS/sdks/iPhoneOS12.4.sdk" ]; then
              echo "::error::Failed to copy iPhoneOS12.4.sdk to $THEOS/sdks"
              exit 1
            fi
            echo "SDK successfully installed."
          fi

          # 3. Устанавливаем dm.pl
          sudo curl -fL -o /usr/local/bin/dm.pl \
            https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl
          sudo chmod +x /usr/local/bin/dm.pl

          chmod +x "$THEOS/bin/"* 2>/dev/null || true

      - name: Verify toolchain
        run: |
          echo "THEOS=$THEOS"
          echo "--- SDKs ---"
          ls "$THEOS/sdks/" || true
          echo "--- Tools ---"
          which clang ldid dpkg-deb || true

      - name: Lint plists
        run: |
          for p in daemon/entitlements.plist app/entitlements.plist app/Info.plist \
                   layout/Library/LaunchDaemons/com.navigatio.daemon.plist; do
            if [ ! -f "$p" ]; then
              echo "::warning::File $p not found - skipping"
              continue
            fi
            echo "-> $p"
            python3 -c "import plistlib, sys; plistlib.load(open(sys.argv[1], 'rb')); print('ok')" "$p"
          done

      - name: Build
        run: |
          make clean >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: navigatio-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .theos/_/DEBIAN
            **/*.log
          if-no-files-found: ignore
